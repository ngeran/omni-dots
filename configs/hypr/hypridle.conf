# =============================================================================
# HYPRIDLE CONFIGURATION
# Optimized for OLED longevity and reliability
# =============================================================================

general {
    # Command to run when we want to lock the screen. Velocity lock (quickshell
    # -c lock) since P3 — re-entry is guarded inside the script itself, which
    # is why this is no longer a pidof || form. Absolute path: hypridle's unit
    # PATH is a closed set (see the brightnessctl note below).
    lock_cmd = /etc/profiles/per-user/nikos/bin/velocity-lock
    
    # Run before the system goes to sleep (suspend/hibernate)
    before_sleep_cmd = loginctl lock-session    
    
    # Ensure display is ON when we wake the computer up
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  
    
    # Set to 'true' to ensure the screen turns off even if media is playing
    # This fixes issues where browsers/apps prevent the monitor from shutting down
    ignore_dbus_inhibit = true
}

# ── Stage 1: Dimming (The Warning) ───────────────────────────────────────────
# Lowers brightness before locking. Good for OLED to reduce heat/power.
listener {
    timeout = 180                                # 3 minutes
    # Absolute paths: hypridle's systemd unit PATH is a closed set with NO
    # /run/current-system/sw — bare "brightnessctl" was command-not-found on
    # every idle cycle, so dimming was silently dead.
    # P5.6: idle also FREEZES the live-wallpaper decode through the bar's
    # wallpaper-service (reason "idle") — 3 min of no input means nobody is
    # watching; Stage 2 locks at 5 min and Stage 3 kills the panel at 5.5.
    # `;` before the IPC: brightness must restore even if the bar is down
    # (same shape as Stage 3's resume). Service-side the reason is transient
    # and respects the user HOLD, so this never fights a manual freeze.
    on-timeout = /run/current-system/sw/bin/brightnessctl -s set 10% ; /etc/profiles/per-user/nikos/bin/quickshell ipc -c bar call wallpaper-service pauseFor idle   # dim to 10% + pause wallpaper decode
    on-resume = /run/current-system/sw/bin/brightnessctl -r ; /etc/profiles/per-user/nikos/bin/quickshell ipc -c bar call wallpaper-service resumeFor idle            # restore brightness + resume decode
}

# ── Stage 2: Lock Session ───────────────────────────────────────────────────
# Secures the session.
listener {
    timeout = 300                                # 5 minutes
    on-timeout = loginctl lock-session           # Calls the lock_cmd defined above
}

# ── Stage 3: Display Off ────────────────────────────────────────────────────
# Turns off the signal (DPMS) shortly after locking.
# Separating this from Stage 2 ensures the lock is ready before power-off.
listener {
    timeout = 330                                # 5.5 minutes
    # Wallpaper freeze rides on DPMS: the panel is off, so pausing the decode
    # is purely power/heat hygiene — nothing is visible to burn in. `pause`
    # stops mpv decoding (mpvpaper keeps its layer with the last frame; safe
    # on a powered-off OLED). Absolute path: hypridle's unit PATH is a closed
    # set (same reason brightnessctl above is absolute).
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })' && /run/current-system/sw/bin/wallpaper-engine pause       # Turn off the display signal + freeze decode
    # `;` before resume: it must run even if the bar toggle fails. With no
    # mpvpaper running, resume is a cheap no-op.
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && sleep 1 && /etc/profiles/per-user/nikos/bin/quickshell ipc -c bar call barToggle toggle ; /run/current-system/sw/bin/wallpaper-engine resume    # Display on + bar toggle + unfreeze decode
}

# ── Stage 4: Emergency Suspend (Optional) ───────────────────────────────────
# If the computer stays idle for 30 minutes, suspend to RAM.
